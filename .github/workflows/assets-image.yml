name: Assets Image

on:
  pull_request:
    paths:
      - Dockerfile
      - tests/assets-image.py
      - .github/workflows/assets-image.yml

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test assets image and volume copy
        run: python3 tests/assets-image.py
